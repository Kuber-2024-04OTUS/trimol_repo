apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otus
  namespace: otus
spec:
  destination:
    name: ''
    namespace: otus
    server: https://kubernetes.default.svc
  source:
    path: otus
    repoURL: https://github.com/Kuber-2024-04OTUS/trimol_repo.git
    targetRevision: HEAD
  sources: []
  project: otus
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
