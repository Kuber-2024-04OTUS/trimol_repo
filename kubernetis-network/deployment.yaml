apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework2
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: homework2
  template:
    metadata:
      labels:
        app: homework2
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: homework
                operator: In
                values:
                - "true"
      containers:
      - name: homework2
        image: nginx:latest
        ports:
          - containerPort: 8000
            name: nginx-port
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/
        - name: work-dir
          mountPath: /homework
      volumes:
        - name: work-dir
          emptyDir: {}
        - name: config
          configMap:
            name: cm-nginx
            items:
              - key: default.conf
                path: default.conf